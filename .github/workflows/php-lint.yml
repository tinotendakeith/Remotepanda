name: PHP syntax check

on:
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.php'
      - '.github/workflows/php-lint.yml'

permissions:
  contents: read

jobs:
  lint-changed-php:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Find changed PHP files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.php' > changed-php.txt
          echo "count=$(wc -l < changed-php.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Lint changed PHP files
        if: steps.changed.outputs.count != '0'
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Linting $file"
            php -l "$file" || failed=1
          done < changed-php.txt
          exit "$failed"

      - name: No PHP changes
        if: steps.changed.outputs.count == '0'
        run: echo "No changed PHP files to lint."
